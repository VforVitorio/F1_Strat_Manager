[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-strat-manager"
version = "2.2.3"
description = "F1 StratLab — multi-agent race strategy intelligence system"
authors = [{name = "Victor Vega Sobral", email = "victorvegasobral@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # ===================
    # CORE DATA
    # ===================
    "fastf1>=3.1.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pyarrow>=23.0.1",
    # ===================
    # ML / DEEP LEARNING
    # ===================
    "xgboost>=1.7.0",
    "scikit-learn>=1.3.0,<1.8.0",
    # torch / torchvision: declared here so `uv sync` resolves them; the
    # CUDA-specific wheel is selected by [tool.uv.sources] below (cu128 on
    # Windows/Linux, CPU wheel on macOS). pip users hit the default PyPI
    # wheel and should install the CUDA build manually before `pip install -e .`.
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pytorch-lightning>=2.0.0",
    # ===================
    # NLP
    # ===================
    "transformers>=5.5.0",
    # Explicit dep even though transformers pulls it transitively — the
    # first-run data cache (src/f1_strat_manager/data_cache.py) imports
    # huggingface_hub.snapshot_download directly and needs a version with
    # local_dir + allow_patterns support (>=0.20).
    "huggingface_hub>=0.20",
    "sentencepiece>=0.1.99",
    "openai-whisper>=20230918",
    "sentence-transformers>=2.2.0",
    "spacy>=3.7.0",
    "tiktoken>=0.5.0",
    # ===================
    # AGENTS / EXPERT SYSTEM
    # ===================
    "experta>=1.9.4",
    "langgraph>=1.0.10rc1",
    "langchain>=1.3.9",
    # ===================
    # COMPUTER VISION
    # ===================
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    # pillow is CAPPED at 11.3.x by arcade==3.3.3 (pins pillow>=11.3.0,<11.4), so
    # the 12.2.0 fix for the 6 OSV CVEs is unreachable without a pre-release
    # arcade. Those CVEs need untrusted-image input we never accept and are
    # waived in osv-scanner.toml (#403); revisit when arcade allows pillow>=12.
    "pillow>=11.3.0",
    # ===================
    # BACKEND / STREAMING
    # ===================
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0.0",
    "kafka-python>=2.0.2",
    "python-multipart>=0.0.31",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    # ===================
    # DATABASE
    # ===================
    "qdrant-client>=1.6.0",
    # ===================
    # UI / VISUALIZATION
    # ===================
    "plotly>=5.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # ===================
    # ARCADE / 2D REPLAY
    # ===================
    "arcade>=3.0.0",
    "scipy>=1.10.0",
    "pyside6>=6.5.0",
    "pyqtgraph>=0.13.0",
    # ===================
    # UTILITIES
    # ===================
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.0",
    "requests>=2.33.0",
    "tqdm>=4.65.0",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "optuna>=4.7.0",
    "catboost>=1.2.10",
    "librosa>=0.11.0",
    # soundfile: directly imported by src/nlp/radio_runner.py (radio audio IO).
    # Declared here on its own — it used to ride in via the retired voice extra
    # and librosa's transitive dependency, which is not a contract.
    "soundfile>=0.12.0",
    "nltk>=3.10.0",
    "gliner>=0.2.25",
    "onnxruntime<1.24",
    "setfit>=1.1.3",
    "seqeval>=1.2.2",
    "jiwer>=3.0.0",
    "bs4>=0.0.2",
    # pypdf: used by scripts/build_rag_index.py to read the FIA regulation PDFs.
    # Was imported but undeclared, so a fresh env hit ModuleNotFoundError.
    "pypdf>=4.0.0",
    "langchain-openai>=1.1.14",
    "rich>=14.3.3",
]

[project.scripts]
f1-strat     = "scripts.f1_cli:main"
f1-sim       = "scripts.run_simulation_cli:main"
f1-arcade    = "src.arcade.main:main"
f1-webapp    = "scripts.run_webapp:main"
f1-eval      = "src.strategy.eval.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=26.3.1",
    "ruff>=0.0.286",
    "mypy>=1.0.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.5.10",
    "jupytext>=1.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
# A dev box that ran `npm install` leaves node_modules dirs that setuptools would
# otherwise auto-discover as namespace packages, dragging ~600 of their files into
# the wheel via the "*" package-data glob. Exclude them from discovery so a local
# build stays clean and fast (CI is already immune — clean checkout has none) (#392 D1).
exclude = ["*node_modules*"]

[tool.uv]
# experta 1.9.4 hard-pins frozendict==1.2, which cannot import on Python 3.10+
# (it references the removed collections.Mapping). Override to a working release
# so a fresh `uv sync` no longer ships a broken package; nothing in the codebase
# relies on frozendict's 1.2 API.
override-dependencies = ["frozendict>=2.4.0"]

# ── uv: PyTorch wheel routing ─────────────────────────────────────────────
# `uv sync` reads these blocks and pulls torch / torchvision from the right
# index per platform: cu128 on Windows only (the dev/training box, NVIDIA RTX
# 40/50 series), CPU everywhere else. Linux/macOS resolve to CPU wheels so CI
# runners and CPU-only Linux installs stop downloading ~5 GB of unused CUDA
# libraries (DevEx audit #251); a Linux GPU box can opt back into cu128 by
# editing the markers. Plain pip ignores these tables, so pip users still need
# to install torch manually with the matching wheel before `pip install -e .`.
[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name     = "pytorch-cpu"
url      = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform != 'win32'" },
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.setuptools.exclude-package-data]
# Source maps never belong in a wheel; a dev-box npm build can leave them
# under src/ and the "*" json/yaml glob above would otherwise rake them in.
"*" = ["**/*.map"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
# These packages predate the style rules and carry notebook-extracted code, so they
# are not style-policed. They are NOT skipped outright: see per-file-ignores below,
# which keeps undefined-name checking on. An undefined name is not a style opinion,
# it is code that raises, and one had been sitting in src/agents/ unnoticed (#619).
exclude = [
    "legacy/",
    ".nb_py/",
    "notebooks/",
    "src/data_extraction/",
    "src/telemetry/",
    "src/vision/",
    ".venv/",
]

# The formatter does NOT read lint.per-file-ignores, so dropping these paths from the
# global exclude above would have pulled them into `ruff format` as well: 15 files, a
# reformat diff nobody asked for, on packages whose layout is deliberate. Keep the
# formatter off them and let only the linter in.
[tool.ruff.format]
exclude = ["src/agents/**", "src/nlp/**", "src/strategy/**", "src/shared/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# The formerly-excluded packages, now checked for ONE thing: F821, undefined name.
# Everything else these files would trip is silenced, because enabling the full rule
# set here means 40 style findings (27 unused imports, 7 import-position, 3 ambiguous
# names) against the single real bug, and drowning a gate is how a gate gets ignored.
#
# Measured 2026-07-26: with only F821 live, these paths report exactly one finding,
# which is #619 and is fixed in the same commit as this config. So this costs nothing
# today and catches the next one on the first CI run.
[tool.ruff.lint.per-file-ignores]
"src/agents/**" = ["E", "I", "W", "F401", "F811", "F541", "F841", "F601", "F632"]
"src/nlp/**" = ["E", "I", "W", "F401", "F811", "F541", "F841", "F601", "F632"]
"src/strategy/**" = ["E", "I", "W", "F401", "F811", "F541", "F841", "F601", "F632"]
"src/shared/**" = ["E", "I", "W", "F401", "F811", "F541", "F841", "F601", "F632"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = false
explicit_package_bases = true
exclude = ["legacy/", ".nb_py/", "notebooks/", "src/agents/", "src/nlp/", "src/data_extraction/", "src/strategy/", "src/telemetry/", "src/vision/", "src/shared/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# -ra prints a summary of skips/xfails so CI shows the data/gpu/llm-gated tests
# instead of silently swallowing them (Testing audit T-4).
addopts = "-ra"
markers = [
    "unit: pure hermetic unit test (no data, network, GPU, or LLM)",
    "contract: API/schema/SSE contract test (hermetic, fixture-backed)",
    "data: requires the HF dataset/model weights (skipped on CI runners)",
    "gpu: requires CUDA",
    "llm: requires a live or stubbed LLM backend",
]
