services:
  # FastAPI Backend
  backend:
    build:
      context: ./src/telemetry
      dockerfile: backend/Dockerfile
    container_name: f1_telemetry_backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - F1_STRAT_DATA_ROOT=/app/data
      - LM_STUDIO_HOST=host.docker.internal
    volumes:
      - ./src/telemetry/backend:/app/backend
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./data/rag:/app/data/rag:rw
      - backend_cache:/root/.cache
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - f1_network
    restart: unless-stopped

  # React web app (v2). nginx serves the built SPA and reverse-proxies /api to
  # the backend service, so the browser stays same-origin. The legacy Streamlit
  # app no longer ships in compose (cutover #43); it stays on disk under
  # src/telemetry/frontend/ and runs locally via f1-streamlit.
  webapp:
    build:
      context: ./src/telemetry/webapp
      dockerfile: Dockerfile
    container_name: f1_webapp
    ports:
      - "8501:80"
    depends_on:
      - backend
    networks:
      - f1_network
    restart: unless-stopped

networks:
  f1_network:
    driver: bridge

volumes:
  backend_cache:
