name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/prerender_docs.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage docs/ for deployment
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          # Add a .nojekyll marker so GitHub Pages does not run Jekyll on the
          # output (we ship raw HTML + JSX + CSS that should be served as-is).
          touch _site/.nojekyll

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Prerender doc pages (crawlable HTML + real-URL sitemap + llms-full)
        # Renders each docs/pages/*.md to a real /<slug>/index.html with per-page
        # meta + JSON-LD so AI crawlers and Google see full content at real URLs
        # (the SPA still hydrates over it). Must run BEFORE the version sed so the
        # generated HTML also gets __DOCS_VERSION__ replaced.
        run: |
          npm install marked@^12 --no-save --no-fund --no-audit
          node scripts/prerender_docs.mjs docs _site

      - name: Inject current release version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not read version from pyproject.toml"
            exit 1
          fi
          echo "Injecting version: ${VERSION}"
          find _site -type f \( -name "*.jsx" -o -name "*.js" -o -name "*.html" -o -name "*.md" -o -name "*.css" \) \
            -exec sed -i "s/__DOCS_VERSION__/${VERSION}/g" {} +

      - name: Configure git identity for gh-pages push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          full_commit_message: "deploy(docs): publish ${{ github.sha }}"
