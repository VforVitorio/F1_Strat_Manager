name: CI

on:
  push:
    branches: [main, dev, test, "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main, dev]

# Cancel any in-flight CI for the same ref when a newer push lands.  Keeps
# the queue from piling up when release-please pushes back-to-back PR
# refreshes (which previously stranded 3+ runs in "queued" for 20+ min).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a linter release cannot turn every branch red on its own. See the
  # note above the lint steps before bumping — the bump and the reformatting it
  # implies belong in one deliberate PR.
  RUFF_VERSION: "0.15.22"

# Notes on dependency strategy across the three jobs:
#   - All three jobs enable uv's built-in cache (`enable-cache: true`) and
#     key it off `uv.lock`. uv.lock is now committed so the cache only
#     invalidates when the resolved graph actually changes — cosmetic
#     edits to pyproject.toml (re-ordering, tool config, comments) reuse
#     the wheel store.
#   - All sync calls use `--frozen` to skip resolution entirely and just
#     install the locked versions. Faster than letting uv re-resolve on
#     every run, and guarantees CI sees exactly what the developer
#     committed.
#   - setup-uv installs Python via the `python-version` input, removing
#     the separate `uv python install` step (v7 caches the interpreter
#     alongside the uv binary tarball).
#   - `lint` does NOT call `uv sync`. Ruff is the only tool it needs, so
#     `uvx ruff` runs it as an ephemeral tool — skips installing the full
#     ML/torch stack just to lint Python style.
#   - `typecheck` calls `uv sync --extra dev` (mypy lives in the dev extra)
#     but skips `--all-extras` since the `voice` extra is irrelevant to
#     `src/rag/`. It also caches `.mypy_cache/` so incremental runs only
#     re-check files whose hash actually changed.
#   - `test` keeps `uv sync --all-extras` because the test suite touches
#     voice / streamlit / arcade paths that need every extra installed.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # checkout MUST run before paths-filter: on `push` events the filter
      # falls back to `git diff` and needs the repo + history (fetch-depth:0).
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - 'src/telemetry'

      - name: Skip — no backend/test/dependency changes
        if: steps.changes.outputs.backend != 'true'
        run: echo "No backend/test/dependency changes; skipping pytest."

      - name: Install uv
        if: steps.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: uv sync --all-extras --frozen

      # Guard against a refactor silently dropping the suite to a handful of
      # tests (broken import, accidental mass-skip). Collection counts nodes
      # regardless of skip, so the floor is stable even though most tests are
      # data-gated on CI runners (Testing audit T-4).
      - name: Collected-count floor
        if: steps.changes.outputs.backend == 'true'
        run: |
          n=$(uv run pytest --co -q | grep -c "::" || true)
          echo "collected $n test nodes"
          test "$n" -ge 40

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        run: uv run pytest -v --cov=src --cov-report=term-missing

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Ruff is PINNED. `uvx ruff` resolves the latest release at run time, so a
      # ruff release could turn every branch red without a single line of our code
      # changing — and worse, inconsistently: 0.16.0 shipped on 2026-07-23 and
      # started formatting Python code blocks inside Markdown, yet runs kept
      # passing while the tool cache still held 0.15.x, so the same commit passed
      # one run and failed the next. Bump this deliberately, with the reformat it
      # implies in the same PR (the webapp CI pins prettier for this same reason).
      - name: Ruff check
        run: uvx ruff@${{ env.RUFF_VERSION }} check .

      - name: Ruff format check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      # checkout MUST run before paths-filter: on `push` events the filter
      # falls back to `git diff` and needs the repo + history (fetch-depth:0).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - 'src/telemetry'

      - name: Skip — no backend/test/dependency changes
        if: steps.changes.outputs.backend != 'true'
        run: echo "No backend/test/dependency changes; skipping mypy."

      - name: Install uv
        if: steps.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: uv sync --extra dev --frozen

      # Mypy is incremental: re-runs only re-analyse files whose source
      # has changed since the last successful run. The key includes both
      # pyproject.toml (mypy config) and every file under src/rag/ so the
      # cache invalidates whenever the analysed surface actually moves.
      - name: Cache mypy
        if: steps.changes.outputs.backend == 'true'
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'src/rag/**') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Mypy
        if: steps.changes.outputs.backend == 'true'
        run: uv run mypy src/rag/

  # The PITWALL window is TypeScript, and until this job existed nothing in
  # CI ever loaded it: the Python suite pins the view dict the host returns,
  # so deleting a whole component or the layout rule from the stylesheet left
  # every test green. The sprint-3 exit gate measured exactly that.
  #
  # Advisory for now (`continue-on-error`), the same way pip-audit was
  # introduced: promote it to a required context in `scripts/setup-github.sh`
  # after a clean week. A browser step that turns every branch red on its
  # first flake teaches people to ignore it.
  pitwall-ui:
    name: pitwall-ui
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: src/pitwall/ui
    steps:
      # checkout MUST run before paths-filter: on `push` events the filter
      # falls back to `git diff` and needs the repo + history (fetch-depth:0).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ui:
              - 'src/pitwall/ui/**'
              - '.github/workflows/ci.yml'

      - name: Skip — no PITWALL UI changes
        if: steps.changes.outputs.ui != 'true'
        run: echo "No PITWALL UI changes; skipping the bundle build and smoke."

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.ui == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/pitwall/ui/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.ui == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.ui == 'true'
        run: npm run typecheck

      - name: Build the bundle
        if: steps.changes.outputs.ui == 'true'
        run: npm run build

      - name: Install chromium
        if: steps.changes.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium

      # Structural, not visual: the elements exist, the split computes to the
      # 540 px Qt pins, and the status bar's 1.5 s auto-clear actually fires.
      # Pixels stay a human's job, with `scripts/shot-agents.mjs`.
      - name: Smoke the AGENTS window
        if: steps.changes.outputs.ui == 'true'
        run: npm run smoke

  # Same-day CVE alerts on the locked Python deps (OSV/PyPA), independent of
  # whether the diff touches uv.lock. Always-on (no path filter) per
  # PROJECT_BOOTSTRAP.md §6; advisory (continue-on-error) while baselining,
  # promote to a required check after a clean week.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Audit locked dependencies (advisory)
        continue-on-error: true
        run: |
          uv export --frozen --no-emit-project --all-extras --no-hashes \
            --format requirements-txt -o requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt
