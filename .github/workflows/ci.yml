name: CI

on:
  push:
    branches: [main, dev, test, "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main, dev]

# Cancel any in-flight CI for the same ref when a newer push lands.  Keeps
# the queue from piling up when release-please pushes back-to-back PR
# refreshes (which previously stranded 3+ runs in "queued" for 20+ min).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Notes on dependency strategy across the three jobs:
#   - All three jobs enable uv's built-in cache (`enable-cache: true`) and
#     key it off `uv.lock`. uv.lock is now committed so the cache only
#     invalidates when the resolved graph actually changes — cosmetic
#     edits to pyproject.toml (re-ordering, tool config, comments) reuse
#     the wheel store.
#   - All sync calls use `--frozen` to skip resolution entirely and just
#     install the locked versions. Faster than letting uv re-resolve on
#     every run, and guarantees CI sees exactly what the developer
#     committed.
#   - setup-uv installs Python via the `python-version` input, removing
#     the separate `uv python install` step (v7 caches the interpreter
#     alongside the uv binary tarball).
#   - `lint` does NOT call `uv sync`. Ruff is the only tool it needs, so
#     `uvx ruff` runs it as an ephemeral tool — skips installing the full
#     ML/torch stack just to lint Python style.
#   - `typecheck` calls `uv sync --extra dev` (mypy lives in the dev extra)
#     but skips `--all-extras` since the `voice` extra is irrelevant to
#     `src/rag/`. It also caches `.mypy_cache/` so incremental runs only
#     re-check files whose hash actually changed.
#   - `test` keeps `uv sync --all-extras` because the test suite touches
#     voice / streamlit / arcade paths that need every extra installed.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Mypy is incremental: re-runs only re-analyse files whose source
      # has changed since the last successful run. The key includes both
      # pyproject.toml (mypy config) and every file under src/rag/ so the
      # cache invalidates whenever the analysed surface actually moves.
      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'src/rag/**') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Mypy
        run: uv run mypy src/rag/
