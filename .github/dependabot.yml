version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area: deps"
    ignore:
      # torch / torchvision are routed through CUDA-specific indexes in
      # pyproject.toml [tool.uv.sources]. Dependabot bumps would break the
      # cu128 wheel routing on Windows / Linux. Bump these manually if needed.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      # transformers and sentence-transformers are pinned to versions that
      # match the production model artefacts under data/models/nlp/.
      # Bump these only alongside re-training the affected models (N17-N24).
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      # Core ML / data libraries — block semver-major bumps because their
      # 2.x / 3.x releases historically remove deprecated APIs the project
      # relies on (numpy 2.0 dropped np.bool_ aliases, pandas 3.0 removes
      # several DataFrame methods, sklearn 1.6+ deprecates several
      # estimators). Minor / patch bumps still flow through CI normally,
      # and tests/test_dep_imports.py exercises the API surface we depend
      # on so silent breakage gets caught even on allowed bumps.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lightgbm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xgboost"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "area: ci-cd"
